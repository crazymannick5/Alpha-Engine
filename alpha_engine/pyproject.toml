[project]
name = "personal-alpha-engine"
version = "0.1.0"
description = "Local-first Personal Alpha Engine central hub"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]
[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]
secrets = ["keyring>=25,<26"]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "mypy>=1.14,<2", "ruff>=0.9,<1"]
[project.scripts]
alpha = "alpha_engine.cli.main:main"
alpha-core = "alpha_engine.api.server:main"
alpha-reference-loop = "alpha_engine.reference_loop.runner:main"
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/alpha_engine"]
[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q"
[tool.ruff]
line-length=100
target-version="py312"
[tool.mypy]
python_version="3.12"
strict=true
packages=["alpha_engine"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ae-prediction-markets"
version = "0.9.0.dev1"
description = "Prediction Markets cylinder for Personal Alpha Engine"
requires-python = ">=3.12"
authors = [{name = "Personal Alpha Engine"}]
license = {text = "Proprietary project component"}
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
